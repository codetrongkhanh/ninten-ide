<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NintenIDE - Professional Web Code Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
</head>
<body class="bg-[#1e1e1e] text-gray-200 h-screen flex flex-col overflow-hidden font-sans">

    <!-- TOP NAVBAR -->
    <header class="bg-[#181818] border-b border-[#2d2d2d] h-12 flex items-center justify-between px-4 select-none">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 text-blue-400 font-bold text-lg">
                <i class="fa-solid fa-code-branch"></i>
                <span>NintenIDE</span>
            </div>
            <span class="text-xs bg-[#2d2d2d] text-gray-400 px-2 py-0.5 rounded">v1.0 Pro</span>
        </div>

        <!-- Toolbar: Chọn ngôn ngữ & Nút Chạy Code -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 bg-[#2d2d2d] px-3 py-1 rounded-md">
                <i class="fa-solid fa-laptop-code text-gray-400 text-sm"></i>
                <select id="languageSelect" class="bg-transparent text-sm text-gray-200 focus:outline-none cursor-pointer">
                    <option value="python" data-version="3.10.0">Python (3.10)</option>
                    <option value="cpp" data-version="10.2.0">C++ (GCC 10.2)</option>
                    <option value="c" data-version="10.2.0">C (GCC 10.2)</option>
                    <option value="java" data-version="15.0.2">Java (15.0.2)</option>
                    <option value="javascript" data-version="16.13.0">JavaScript (Node.js)</option>
                    <option value="typescript" data-version="4.5.2">TypeScript</option>
                    <option value="go" data-version="1.16.2">Go (1.16)</option>
                    <option value="rust" data-version="1.68.2">Rust (1.68)</option>
                    <option value="php" data-version="8.2.3">PHP (8.2)</option>
                </select>
            </div>

            <button id="runBtn" onclick="executeCode()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-1.5 rounded-md text-sm font-medium flex items-center space-x-2 transition shadow-lg active:scale-95 cursor-pointer">
                <i class="fa-solid fa-play text-xs"></i>
                <span>Chạy Code</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-[#252526] border-r border-[#2d2d2d] flex flex-col hidden md:flex">
            <div class="p-3 text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                <span>Trình Khám Phá File</span>
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <div class="flex-1 overflow-y-auto px-2 space-y-1">
                <div class="flex items-center space-x-2 px-2 py-1.5 rounded bg-[#37373d] text-white text-sm cursor-pointer">
                    <i class="fa-brands fa-python text-yellow-400"></i>
                    <span id="fileNameDisplay">main.py</span>
                </div>
            </div>
        </aside>

        <!-- EDITOR & CONSOLE AREA -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Tabs Bar -->
            <div class="bg-[#2d2d2d] h-9 flex items-center px-2 border-b border-[#1e1e1e]">
                <div class="bg-[#1e1e1e] text-gray-200 px-4 py-1.5 text-xs flex items-center space-x-2 border-t-2 border-blue-500 rounded-t">
                    <i class="fa-solid fa-file-code text-blue-400"></i>
                    <span id="tabName">main.py</span>
                </div>
            </div>

            <!-- Monaco Editor Container -->
            <div id="editor" class="flex-1 w-full"></div>

            <!-- TERMINAL / INPUT-OUTPUT PANEL -->
            <div class="h-64 bg-[#1e1e1e] border-t border-[#333333] flex flex-col">
                <div class="bg-[#252526] px-4 py-1.5 flex items-center justify-between border-b border-[#333333] text-xs font-semibold text-gray-400">
                    <div class="flex items-center space-x-4">
                        <span class="text-white border-b-2 border-blue-500 pb-1">CONSOLE & INPUT</span>
                    </div>
                    <button onclick="clearConsole()" class="hover:text-white transition cursor-pointer"><i class="fa-solid fa-trash-can"></i> Xóa kết quả</button>
                </div>

                <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                    <!-- Input Section -->
                    <div class="flex-1 flex flex-col border-r border-[#333333] p-2">
                        <label class="text-[11px] text-gray-400 font-bold mb-1 uppercase tracking-wider"><i class="fa-solid fa-keyboard mr-1"></i> Dữ liệu đầu vào (Input / Stdin):</label>
                        <textarea id="stdinInput" class="flex-1 bg-[#181818] text-gray-200 p-2 rounded text-xs font-mono resize-none focus:outline-none border border-[#333333] focus:border-blue-500" placeholder="Nhập dữ liệu đầu vào cho chương trình (nếu có, hỗ trợ nhiều dòng)..."></textarea>
                    </div>

                    <!-- Output Section -->
                    <div class="flex-1 flex flex-col p-2">
                        <label class="text-[11px] text-gray-400 font-bold mb-1 uppercase tracking-wider"><i class="fa-solid fa-terminal mr-1"></i> Kết quả thực thi (Output):</label>
                        <pre id="outputConsole" class="flex-1 bg-[#181818] text-green-400 p-2 rounded text-xs font-mono overflow-y-auto border border-[#333333]">Chưa có kết quả. Nhấn "Chạy Code" để bắt đầu...</pre>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script file riêng biệt -->
    <script src="script.js"></script>
</body>
</html>
